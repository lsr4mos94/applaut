{% extends 'base.html' %}
{% block content %}

<style>
    

    /* Regras Responsivas Adaptadas para Dispositivos Móveis */
    @media (max-width: 767.98px) {
        .busca-fornecedor-group {
            flex-direction: column !important;
        }
        .busca-fornecedor-group input {
            border-radius: 0.375rem !important;
            width: 100% !important;
        }
        .busca-fornecedor-group button {
            border-radius: 0.375rem !important;
            width: 100% !important;
            margin-top: 0.5rem !important;
        }
        .btn-mobile-full { width: 100%; margin-bottom: 0.5rem; }
    }

    @media (min-width: 768px) {
        .busca-fornecedor-group {
            flex-direction: row !important;
        }
        .busca-fornecedor-group input {
            border-top-left-radius: 0.375rem !important;
            border-bottom-left-radius: 0.375rem !important;
            border-top-right-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
        }
        .busca-fornecedor-group button {
            border-top-left-radius: 0 !important;
            border-bottom-left-radius: 0 !important;
            border-top-right-radius: 0.375rem !important;
            border-bottom-right-radius: 0.375rem !important;
            margin-top: 0 !important;
            width: auto !important;
        }
    }
</style>

<div class="mb-4 text-start">
    <h3 class="text-brand fw-semibold">{{ titulo|default:"Nova Solicitação de Verba" }}</h3>
</div>

<div class="card border-0 shadow-sm text-start">
    <div class="card-body p-3 p-md-4">
        <form method="POST" id="formVerba" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3 p-3 rounded box-selecao">
                <label class="form-label-custom d-block mb-3">1. Origem do Fornecedor</label>
                <div class="d-flex gap-4 gap-md-5 flex-wrap">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo_fornecedor" id="t_existente" value="EXISTENTE" 
                            {% if not solicitacao or solicitacao.tipo_fornecedor == 'EXISTENTE' %}checked{% endif %} onchange="toggleBusca()">
                        <label class="form-check-label small fw-medium" for="t_existente">Cadastrado no Protheus</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipo_fornecedor" id="t_novo" value="NOVO" 
                            {% if solicitacao.tipo_fornecedor == 'NOVO' %}checked{% endif %} onchange="toggleBusca()">
                        <label class="form-check-label small fw-medium" for="t_novo">Novo / Sem Cadastro</label>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-12" id="wrapper_busca">
                    <label class="form-label-custom">Localizar Fornecedor (Razão Social ou CNPJ)</label>
                    <div class="input-group busca-fornecedor-group shadow-sm">
                        <input type="text" id="input_protheus" class="form-control bg-busca" placeholder="Digite para localizar no Protheus...">
                        <button class="btn text-white px-4 fw-bold bg-brand" type="button" onclick="buscarProtheus()" id="btnBusca">
                            <i class="bi bi-search me-1"></i> BUSCAR NO PROTHEUS
                        </button>
                    </div>
                </div>
            </div>

            <h6 class="section-title"><i class="bi bi-building me-2"></i>Informações do Fornecedor</h6>
            
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-2 div-protheus">
                    <label class="form-label-custom">Código</label>
                    <input type="text" name="fornecedor_codigo" id="f_cod" class="form-control form-control-sm bg-light" value="{{ solicitacao.fornecedor_codigo|default:'' }}" readonly>
                </div>
                <div class="col-6 col-md-2 div-protheus">
                    <label class="form-label-custom">Loja</label>
                    <input type="text" name="fornecedor_loja" id="f_loj" class="form-control form-control-sm bg-light" value="{{ solicitacao.fornecedor_loja|default:'' }}" readonly>
                </div>
                <div class="col-12 {% if solicitacao.tipo_fornecedor == 'NOVO' %}col-md-8{% else %}col-md-5{% endif %}" id="col-razao">
                    <label class="form-label-custom">Razão Social / Nome</label>
                    <input type="text" name="fornecedor_nome_razao" id="f_nom" class="form-control form-control-sm {% if not solicitacao or solicitacao.tipo_fornecedor == 'EXISTENTE' %}bg-light{% endif %}" value="{{ solicitacao.fornecedor_nome_razao|default:'' }}" required {% if not solicitacao or solicitacao.tipo_fornecedor == 'EXISTENTE' %}readonly{% endif %}>
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label-custom">CPF / CNPJ</label>
                    <input type="text" name="fornecedor_cpf_cnpj" id="f_cgc" class="form-control form-control-sm {% if not solicitacao or solicitacao.tipo_fornecedor == 'EXISTENTE' %}bg-light{% endif %}" value="{{ solicitacao.fornecedor_cpf_cnpj|default:'' }}" required {% if not solicitacao or solicitacao.tipo_fornecedor == 'EXISTENTE' %}readonly{% endif %}>
                </div>
            </div>

            <h6 class="section-title"><i class="bi bi-currency-dollar me-2"></i>Detalhes Financeiros e Pagamento</h6>
            
            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <label class="form-label-custom">Produto / Serviço</label>
                    <input type="text" name="produto_servico" class="form-control form-control-sm shadow-sm" value="{{ solicitacao.produto_servico|default:'' }}" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label-custom">Categoria / Verba</label>
                    <select name="categoria" class="form-select form-select-sm shadow-sm" required>
                        <option value="" disabled {% if not solicitacao %}selected{% endif %}>Selecione...</option>
                        {% for val, label in categorias %}
                            <option value="{{ val }}" {% if solicitacao.categoria == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 col-md-4">
                    <label class="form-label-custom">Forma de Pagamento</label>
                    <select name="forma_pagamento" class="form-select form-select-sm shadow-sm" required>
                        <option value="" disabled {% if not solicitacao %}selected{% endif %}>Selecione...</option>
                        {% for val, label in forma_pagamento %}
                            <option value="{{ val }}" {% if solicitacao.forma_pagamento == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label-custom">Valor</label>
                    <input type="text" id="id_valor" name="valor" class="form-control form-control-sm shadow-sm text-center fw-bold" value="{{ solicitacao.valor|default:'' }}" placeholder="R$ 0,00" required>
                </div>
                <div class="col-6 col-md-4">
                    <label class="form-label-custom">Data Vencimento</label>
                    <input type="date" name="data_vencimento" class="form-control form-control-sm shadow-sm" value="{{ solicitacao.data_vencimento|date:'Y-m-d' }}" required>
                </div>
            </div>

            <div class="mb-3 p-3 rounded box-selecao">
                <label class="form-label-custom d-block mb-3">Possui Nota Fiscal ou Recibo?</label>
                <div class="d-flex gap-4 gap-md-5 mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tem_documento" id="nota_sim" value="True" {% if solicitacao.tem_documento %}checked{% endif %} onchange="toggleDocumentoField()">
                        <label class="form-check-label small fw-medium" for="nota_sim">Sim</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tem_documento" id="nota_nao" value="False" {% if not solicitacao.tem_documento %}checked{% endif %} onchange="toggleDocumentoField()">
                        <label class="form-check-label small fw-medium" for="nota_nao">Não</label>
                    </div>
                </div>

                <div id="wrapper_arquivo_nota" class="mt-3 {% if not solicitacao.tem_documento %}d-none{% endif %}">
                    <label class="form-label-custom text-danger">Anexar Nota Fiscal / Recibo *</label>
                    <input type="file" name="arquivo_nota" id="id_arquivo_nota" class="form-control form-control-sm shadow-sm mt-1" accept="image/*,application/pdf">
                    <small class="text-muted d-block mt-1">Envie o documento em formato de imagem ou PDF.</small>
                </div>
            </div>

            <div class="mb-5">
                <label class="form-label-custom">Observações Detalhadas</label>
                <textarea name="observacoes" class="form-control shadow-sm" rows="3" placeholder="Descreva com detalhes a sua solicitação e forma de pagamento.">{{ solicitacao.observacoes|default:'' }}</textarea>
            </div>

            <div class="d-flex flex-column flex-md-row justify-content-md-end gap-2 border-top pt-4">
                <a href="{% url 'listar_solicitacoes_verba' %}" class="btn btn-light border px-4 btn-mobile-full text-center fw-bold text-muted">Cancelar</a>
                <button type="submit" class="btn text-white px-5 btn-mobile-full shadow-sm bg-brand">
                    <strong><i class="bi bi-check2-circle me-1"></i> Salvar solicitação</strong>
                </button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="modalBusca" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header">
                <h6 class="modal-title fw-bold">Selecione o Fornecedor</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0" style="max-height: 450px; overflow-y: auto;">
                <div id="lista_resultados" class="list-group list-group-flush"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/imask"></script>
<script>
    let mBusca;
    document.addEventListener('DOMContentLoaded', () => {
        mBusca = new bootstrap.Modal(document.getElementById('modalBusca'));
        IMask(document.getElementById('id_valor'), {
            mask: 'R$ num',
            blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true, radix: ',', mapToRadix: ['.'] } }
        });
        
        // Aplica o estado inicial correto ao carregar a página
        toggleBusca();
    });

    function toggleBusca() {
        const isNovo = document.getElementById('t_novo').checked;
        const divsProtheus = document.querySelectorAll('.div-protheus');
        const colRazao = document.getElementById('col-razao');
        const wrapper = document.getElementById('wrapper_busca');
        const fNom = document.getElementById('f_nom');
        const fCgc = document.getElementById('f_cgc');

        if (isNovo) {
            wrapper.classList.add('d-none');
            divsProtheus.forEach(d => d.classList.add('d-none'));
            colRazao.classList.replace('col-md-5', 'col-md-8');
            fNom.readOnly = false; fNom.classList.remove('bg-light');
            fCgc.readOnly = false; fCgc.classList.remove('bg-light');
            document.getElementById('f_cod').value = '';
            document.getElementById('f_loj').value = '';
        } else {
            wrapper.classList.remove('d-none');
            divsProtheus.forEach(d => d.classList.remove('d-none'));
            colRazao.classList.replace('col-md-8', 'col-md-5');
            fNom.readOnly = true; fNom.classList.add('bg-light');
            fCgc.readOnly = true; fCgc.classList.add('bg-light');
        }
    }

    function buscarProtheus() {
        const termo = document.getElementById('input_protheus').value.trim();
        if (termo.length < 3) return alert("Digite pelo menos 3 caracteres.");
        const btn = document.getElementById('btnBusca');
        btn.disabled = true;

        fetch("{% url 'busca_fornecedor_protheus' %}?q=" + encodeURIComponent(termo))
            .then(lerJson)
            .then(data => {
                const lista = document.getElementById('lista_resultados');
                lista.innerHTML = data.length ? '' : '<div class="p-4 text-center">Nenhum fornecedor encontrado.</div>';
                data.forEach(f => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'list-group-item list-group-item-action p-3';
                    item.innerHTML = `<strong>${f.nome}</strong><br><small class="text-muted">CNPJ: ${f.cnpj} | Cód: ${f.codigo}</small>`;
                    item.onclick = () => {
                        document.getElementById('f_cod').value = f.codigo;
                        document.getElementById('f_loj').value = f.loja;
                        document.getElementById('f_nom').value = f.nome;
                        document.getElementById('f_cgc').value = f.cnpj;
                        mBusca.hide();
                    };
                    lista.appendChild(item);
                });
                mBusca.show();
            })
            .finally(() => btn.disabled = false);
    }

    // Feriados nacionais do ano atual e do próximo (inclui os móveis: Carnaval, Sexta-feira Santa e Corpus Christi)
    function obterFeriados() {
        const fmt = d => d.toISOString().split('T')[0];
        const pascoa = (ano) => {
            const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4;
            const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(Date.UTC(ano, mes - 1, dia));
        };
        const mais = (data, dias) => new Date(data.getTime() + dias * 86400000);
        const lista = [];
        const anoAtual = new Date().getFullYear();
        [anoAtual, anoAtual + 1].forEach(ano => {
            ['01-01', '04-21', '05-01', '09-07', '10-12', '11-02', '11-15', '11-20', '12-25'].forEach(md => lista.push(`${ano}-${md}`));
            const p = pascoa(ano);
            [mais(p, -48), mais(p, -47), mais(p, -2), mais(p, 60)].forEach(d => lista.push(fmt(d)));
        });
        return lista;
    }

    function calcularDataMinima(diasUteis) {
        let data = new Date();
        let cont = 0;
        const feriados = obterFeriados();
        
        while (cont < diasUteis) {
            data.setDate(data.getDate() + 1);
            
            let dataString = data.toISOString().split('T')[0];
            let diaSemana = data.getDay();

            let eFinalDeSemana = (diaSemana === 0 || diaSemana === 6);
            let eFeriado = feriados.includes(dataString);

            if (!eFinalDeSemana && !eFeriado) {
                cont++;
            }
        }
        return data.toISOString().split('T')[0];
    }

    document.addEventListener('DOMContentLoaded', () => {
        const inputData = document.querySelector('input[name="data_vencimento"]');
        if (!inputData) return;

        const dataMinima = calcularDataMinima(2);
        
        inputData.setAttribute('min', dataMinima);

        document.getElementById('formVerba').addEventListener('submit', function(e) {
            if (inputData.value && inputData.value < dataMinima) {
                e.preventDefault();
                alert("Atenção: Devido a finais de semana ou feriados, a data mínima para pagamento é " + dataMinima.split('-').reverse().join('/'));
                inputData.focus();
            }
        });
    });

    function toggleDocumentoField() {
        const simChecked = document.getElementById('nota_sim').checked;
        const wrapper = document.getElementById('wrapper_arquivo_nota');
        const inputNota = document.getElementById('id_arquivo_nota');
        
        if (wrapper && inputNota) {
            if (simChecked) {
                wrapper.classList.remove('d-none');
            } else {
                wrapper.classList.add('d-none');
                inputNota.value = '';
            }
        }
    }
</script>
{% endblock %}
